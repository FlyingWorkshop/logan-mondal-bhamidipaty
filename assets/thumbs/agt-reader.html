<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Intersection game</title>
<!-- CS 269I reader, lecture "Equilibria in Games", Example 4: two cars at an intersection,
     actions Go/Wait, payoffs (Go,Go)=(-99,-99), (Go,Wait)=(1,0), (Wait,Go)=(0,1), (Wait,Wait)=(0,0).
     Correlated equilibrium: (Go,Wait) 50% and (Wait,Go) 50%, signalled by a correlating device
     such as a stop light. First half of the loop shows the (Go,Go) cell and its -99 payoff; second
     half shows the stop light picking who goes, so the crash cell is never played. -->
<style>
html,body{margin:0;height:100%;background:#16121F;overflow:hidden}
canvas{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
</style></head><body>
<canvas id="c" role="img" aria-label="Two cars at an intersection. With no signal both go and crash, a payoff of minus 99 each. With a stop light the cars take turns: a correlated equilibrium."></canvas>
<script>
(function(){
var W=120,H=90,LOOP=8;
var NIGHT="#16121F",PANEL="#1E1829",PHI="#272036",LINE="#3A3149",BONE="#EEE7DA",TEXT="#C9C2B8",MUTED="#8E879A",
    ACC="#F2A25C",ACCS="#F8D3A0",ACCD="#B8743A",RED="#E5533D",REDD="#5A2530",BLUE="#6FA8FF",BLUED="#3E5E99",BLUES="#CFE0FF",
    GREEN="#7BC47F",GREENS="#C8EFC9",ROAD="#2A2339",CURB="#3A3149";
var art=document.createElement("canvas");art.width=W;art.height=H;var g=art.getContext("2d");
var cv=document.getElementById("c"),ctx=cv.getContext("2d"),S=1,ox=0,oy=0;
function fit(){var d=window.devicePixelRatio||1;cv.width=Math.round(innerWidth*d);cv.height=Math.round(innerHeight*d);
  var s=Math.min(cv.width/W,cv.height/H),si=Math.floor(s);if(si>=1&&si/s>=0.8)s=si;S=s;
  ox=Math.round((cv.width-W*s)/2);oy=Math.round((cv.height-H*s)/2);}
var DX=0,DY=0;
function R(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x+DX),Math.round(y+DY),w,h);}
function P(x,y,c){R(x,y,1,1,c);}
/* 3x5 bitmap font */
var F={A:"010101111101101",B:"110101110101110",C:"011100100100011",D:"110101101101110",E:"111100110100111",I:"111010010010111",
L:"100100100100111",M:"10001/11011/10101/10001/10001",N:"1001/1101/1011/1001/1001",O:"010101101101010",Q:"0110/1001/1001/1010/0101",
R:"110101110101101",T:"111010010010010",U:"101101101101111","9":"111101111001110","-":"000000111000000"};
function gw(ch){var b=F[ch];return ch===" "?3:b&&b.indexOf("/")>0?b.indexOf("/")+1:4;}
function T(s,x,y,c,k){k=k||1;for(var i=0;i<s.length;i++){var ch=s[i],b=F[ch],w=gw(ch);
  if(b){var r=b.indexOf("/")>0?b.split("/"):[b.slice(0,3),b.slice(3,6),b.slice(6,9),b.slice(9,12),b.slice(12)];
    for(var yy=0;yy<5;yy++)for(var xx=0;xx<r[yy].length;xx++)if(r[yy][xx]==="1")R(x+xx*k,y+yy*k,k,k,c);}x+=w*k;}}
function TW(s,k){var w=0;for(var i=0;i<s.length;i++)w+=gw(s[i]);return (w-1)*(k||1);}

/* geometry: horizontal road y27..52, vertical road x47..72 */
var HY=27,HH=26,VX=47,VW=26,SCENE=80;
function ground(){
  R(0,0,W,SCENE,PANEL);
  for(var y=0;y<SCENE;y++)for(var x=0;x<W;x++)if(((x*5+y*3)%7===0)&&((x+y)%3===0))P(x,y,PHI);
  var B=[[3,3,VX-9,HY-9],[VX+VW+6,3,W-VX-VW-9,HY-9],[3,HY+HH+6,VX-9,SCENE-HY-HH-9],[VX+VW+6,HY+HH+6,W-VX-VW-9,SCENE-HY-HH-9]];
  for(var i=0;i<B.length;i++){var b=B[i];R(b[0],b[1],b[2],b[3],PHI);R(b[0],b[1],b[2],1,LINE);R(b[0],b[1],1,b[3],LINE);
    R(b[0]+4,b[1]+4,b[2]-8,b[3]-8,PANEL);R(b[0]+4,b[1]+b[3]-4,b[2]-8,1,NIGHT);}
  R(0,HY-2,W,HH+4,CURB);R(VX-2,0,VW+4,SCENE,CURB);
  R(0,HY,W,HH,ROAD);R(VX,0,VW,SCENE,ROAD);
  for(var x=0;x<W;x+=8)if(x+5<VX-6||x>VX+VW+5)R(x,HY+12,5,1,MUTED);
  for(var y=0;y<SCENE;y+=8)if(y+5<HY-6||y>HY+HH+5)R(VX+12,y,1,5,MUTED);
  for(var y2=HY+1;y2<HY+HH;y2+=3){R(VX-5,y2,3,2,LINE);R(VX+VW+2,y2,3,2,LINE);}
  for(var x2=VX+1;x2<VX+VW;x2+=3){R(x2,HY+HH+2,2,3,LINE);R(x2,HY-5,2,3,LINE);}
  R(VX-8,HY+13,1,13,BONE);R(VX+13,HY+HH+7,13,1,BONE);
}
/* eastbound car 17x10, front at fx, lane y41..50 */
function beamE(fx){for(var i=1;i<=22;i++){var h=3+Math.floor(i/2.2);g.globalAlpha=.3*(1-i/24);R(fx+i,46-h,1,2*h,ACCS);}g.globalAlpha=1;}
function carE(fx){var x=Math.round(fx)-16,y=41;
  R(x+2,y-1,4,1,NIGHT);R(x+11,y-1,4,1,NIGHT);R(x+2,y+10,4,1,NIGHT);R(x+11,y+10,4,1,NIGHT);
  R(x,y,17,10,ACC);R(x,y+9,17,1,ACCD);R(x+11,y+1,3,8,ACCS);R(x+4,y+1,7,8,ACCD);R(x+5,y+2,5,6,ACC);R(x+2,y+2,2,6,ACCD);
  R(x+16,y+1,1,2,BONE);R(x+16,y+7,1,2,BONE);R(x,y+1,1,2,RED);R(x,y+7,1,2,RED);}
/* northbound car 10x17, front at fy, lane x61..70 */
function beamN(fy){for(var i=1;i<=22;i++){var w=3+Math.floor(i/2.2);g.globalAlpha=.3*(1-i/24);R(66-w,fy-i,2*w,1,BLUES);}g.globalAlpha=1;}
function carN(fy,dx){var x=61+(dx||0),y=Math.round(fy);
  R(x-1,y+2,1,4,NIGHT);R(x+10,y+2,1,4,NIGHT);R(x-1,y+11,1,4,NIGHT);R(x+10,y+11,1,4,NIGHT);
  R(x,y,10,17,BLUE);R(x+9,y,1,17,BLUED);R(x+1,y+3,8,3,BLUES);R(x+1,y+6,8,7,BLUED);R(x+2,y+7,6,5,BLUE);R(x+2,y+13,6,2,BLUED);
  R(x+1,y,2,1,BONE);R(x+7,y,2,1,BONE);R(x+1,y+16,2,1,RED);R(x+7,y+16,2,1,RED);}
/* signal: 7x13 housing, red over green; s = 0 off, 1 go, -1 stop */
function signal(x,y,s){R(x-1,y-1,9,15,NIGHT);R(x,y,7,13,LINE);R(x+1,y+1,5,5,s<0?RED:REDD);R(x+1,y+7,5,5,s>0?GREEN:"#2C3A33");
  if(s){var cy=s<0?y+3:y+9,col=s<0?RED:GREEN;g.globalAlpha=.18;R(x-3,cy-5,13,11,col);R(x-5,cy-3,17,7,col);g.globalAlpha=.3;R(x-1,cy-3,9,7,col);g.globalAlpha=1;
    R(x+1,cy-2,5,5,col);R(x+2,cy-1,2,2,s<0?"#FFB3A6":GREENS);}
  R(x+3,y+14,1,3,MUTED);}

/* draw a car sprite rotated about its centre (nearest-neighbour, stays pixel art) */
var spc=document.createElement("canvas");spc.width=spc.height=28;var sg=spc.getContext("2d");
function spun(fn,cx,cy,ang,haz,w,h){var mg=g,mdx=DX,mdy=DY;sg.clearRect(0,0,28,28);g=sg;
  /* translate the sprite so its centre lands at (14,14) */
  DX=0;DY=0;g.save();g.translate(Math.round(14-cx),Math.round(14-cy));fn();g.restore();
  if(haz){g.fillStyle=ACC;var l=Math.round(14-w/2),tp=Math.round(14-h/2);g.fillRect(l,tp,1,1);g.fillRect(l+w-1,tp,1,1);g.fillRect(l,tp+h-1,1,1);g.fillRect(l+w-1,tp+h-1,1,1);}
  g=mg;DX=mdx;DY=mdy;g.save();g.imageSmoothingEnabled=false;g.translate(Math.round(cx+DX),Math.round(cy+DY));g.rotate(ang);g.drawImage(spc,-14,-14);g.restore();}
function ease(u){return u<0?0:u>1?1:u*u*(3-2*u);}
function clamp(u){return u<0?0:u>1?1:u;}
var CRASH=1.8,CX=61,CY=46;
var SP=[];for(var i=0;i<18;i++){var a=i/18*Math.PI*2+(i%3)*.21;SP.push([Math.cos(a),Math.sin(a),.6+((i*37)%10)/12,i%3]);}

function draw(t){
  DX=0;DY=0;
  if(t>=CRASH&&t<CRASH+.45){var k=Math.floor((t-CRASH)*30);DX=[1,-1,0,1,-1,0][k%6];DY=[0,1,-1,-1,0,1][k%6];}
  R(-2,-2,W+4,H+4,NIGHT);
  ground();
  var sigE=0,sigN=0;
  if(t>=3.5&&t<7.5){sigE=t<5.2?1:-1;sigN=t<5.2?-1:1;}
  /* phase A: no signal, both go */
  if(t<3.6){
    var vis=t<3.2||Math.floor((t-3.2)*10)%2===0;
    var u=clamp(t/CRASH),fx=-2+62*u,fy=92-55*u;
    if(vis){if(t<CRASH){beamE(fx);beamN(fy);carN(fy);carE(fx);}
      else{var a0=t-CRASH,k0=1-Math.pow(1-clamp(a0/.45),3),haz=Math.floor(a0*4)%2===0;
        spun(function(){carN(fy);},65.5+5*k0,fy+8-1*k0,.5*k0,haz,10,17);
        spun(function(){carE(fx);},fx-7.5-2*k0,45.5+1*k0,-.18*k0,haz,17,10);}}
  }else{
    /* phase B: the light picks who goes */
    var fxB=-2+142*clamp((t-3.7)/1.8);
    var fyB=t<4.8?92-29*(1-Math.pow(1-clamp((t-3.7)/1.1),2)):63-83*Math.pow(clamp((t-5.4)/1.4),1.7);
    if(t>3.7&&fxB<138){beamE(fxB);carE(fxB);}
    if(t>3.7&&fyB>-20){if(t>5.4)beamN(fyB);carN(fyB);}
  }
  signal(30,58,sigE);signal(78,58,sigN);
  /* pulse ring when the light switches on or swaps */
  var ev=[3.5,5.2];for(var e=0;e<2;e++){var d=t-ev[e];if(d>=0&&d<.5){var rr2=Math.floor(4+d*26),cs=[[33.5,e?61:67],[81.5,e?67:61]];
    g.globalAlpha=1-d/.5;for(var c2=0;c2<2;c2++){var col2=(c2===0)===(e===0)?GREEN:RED;if(e===0&&c2===1)col2=RED;if(e===1&&c2===1)col2=GREEN;if(e===1&&c2===0)col2=RED;
      for(var q2=0;q2<32;q2++){var th2=q2/32*Math.PI*2;P(cs[c2][0]+Math.round(Math.cos(th2)*rr2),cs[c2][1]+Math.round(Math.sin(th2)*rr2),col2);}}g.globalAlpha=1;}}
  /* crash burst */
  if(t>=CRASH&&t<CRASH+1.4){var a=t-CRASH;
    if(a<.08){g.globalAlpha=.3;R(0,0,W,SCENE,BONE);g.globalAlpha=1;}
    var rr=Math.floor(2+a*40);if(a<.35){g.globalAlpha=1-a/.35;for(var q=0;q<40;q++){var th=q/40*Math.PI*2;P(CX+Math.round(Math.cos(th)*rr),CY+Math.round(Math.sin(th)*rr),ACCS);}g.globalAlpha=1;}
    for(var s=0;s<SP.length;s++){var p=SP[s],d=Math.pow(a,.55)*22*p[2];if(a<1.1*p[2]){var col=[BONE,ACCS,ACC][p[3]];
      P(CX+Math.round(p[0]*d),CY+Math.round(p[1]*d),col);if(a<.5)P(CX+Math.round(p[0]*(d-1.5)),CY+Math.round(p[1]*(d-1.5)),ACC);}}
    if(a<.6){R(CX-2,CY-1,5,3,BONE);R(CX-1,CY-2,3,5,BONE);}
    for(var m=0;m<4;m++){var b2=a-.15-m*.18;if(b2>0&&b2<1.1){var rad=2+b2*6,px=CX+2+m*2+b2*6,py=CY-3-b2*10-m;g.globalAlpha=.45*(1-b2/1.1);
      for(var yy=-rad;yy<=rad;yy++)for(var xx=-rad;xx<=rad;xx++)if(xx*xx+yy*yy<=rad*rad)P(px+xx,py+yy,MUTED);g.globalAlpha=1;}}
  }
  /* -99 */
  if(t>=CRASH+.05&&t<3.6&&(t<3.2||Math.floor((t-3.2)*10)%2===0)){var str="-99",k2=3,w2=TW(str,k2),x0=Math.round(CX-w2/2)+8,y0=8-(t<CRASH+.2?2:0);
    T(str,x0+1,y0+1,NIGHT,k2);T(str,x0-1,y0,NIGHT,k2);T(str,x0,y0-1,NIGHT,k2);T(str,x0,y0,RED,k2);}
  /* caption strip */
  DX=0;DY=0;R(0,SCENE,W,H-SCENE,NIGHT);
  var cap="CORRELATED EQUILIBRIUM";T(cap,Math.round((W-TW(cap))/2),SCENE+3,t>=3.5&&t<7.5?ACCS:MUTED);
}
function blit(){ctx.imageSmoothingEnabled=false;ctx.fillStyle=NIGHT;ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(art,ox,oy,W*S,H*S);}
var mq=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)"),last=-1e9,t0=null,HT=null;
function readHash(){var m=/t=([\d.]+)/.exec(location.hash);HT=m?(+m[1])%LOOP:null;}
function still(){draw(HT!==null?HT:4.55);blit();}
function frozen(){return HT!==null||(mq&&mq.matches);}
function frame(now){if(frozen()){still();return;}
  if(t0===null)t0=now;if(now-last>=16){last=now;draw(((now-t0)/1000)%LOOP);blit();}requestAnimationFrame(frame);}
readHash();fit();
addEventListener("resize",function(){fit();if(frozen())still();});
addEventListener("hashchange",function(){var was=frozen();readHash();if(frozen())still();else if(was)requestAnimationFrame(frame);});
if(mq&&mq.addEventListener)mq.addEventListener("change",function(){if(!frozen())requestAnimationFrame(frame);else still();});
if(frozen())still();else requestAnimationFrame(frame);
})();
</script></body></html>
