<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIRD reward loop</title>
<!-- BIRD (arXiv 2610.04364): the iterative reward design loop on Meta-World button press (paper Figs. 1-2,
     task "Press the button down and hold it."). A reward scroll unrolls, the robot arm trains on it and misses,
     feedback flows back, the reward code is revised (red lines out, green lines in, as in Fig. 2's A -> A' diff),
     and the arm presses and holds the button. Pixel art, no numbers shown. -->
<style>
html,body{margin:0;height:100%;background:#16121F;overflow:hidden}
canvas{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block;image-rendering:pixelated}
</style></head><body><canvas id="c" aria-label="Pixel-art loop: a reward-code scroll trains a robot arm that misses a button; the code is rewritten and the arm presses the button"></canvas><script>
(function(){
var W=120,H=90,LOOP=8;
var NIGHT="#16121F",PANEL="#1E1829",PHI="#2A2238",PHI2="#3A3150",BONE="#EEE7DA",TEXT="#C9C2B8",MUTED="#8E879A",
    ACC="#F2A25C",ACCS="#F8D3A0",ACCD="#C9803F",MID="#4A4160",OUT="#0D0A14",
    RED="#E0533F",REDL="#F4C2B4",REDD="#7A2A2A",GRN="#5FD38A",GRND="#2E8C55",GRNL="#C6EDCD",PURP="#7E5BA6",BLUE="#5B8BD9";
var art=document.createElement("canvas");art.width=W;art.height=H;var g=art.getContext("2d");
var cv=document.getElementById("c"),ctx=cv.getContext("2d"),S=1,ox=0,oy=0;
function fit(){var d=window.devicePixelRatio||1;cv.width=Math.round(innerWidth*d);cv.height=Math.round(innerHeight*d);
  var s=Math.min(cv.width/W,cv.height/H),si=Math.floor(s);if(si>=1&&si/s>=0.8)s=si;S=s;
  ox=Math.round((cv.width-W*s)/2);oy=Math.round((cv.height-H*s)/2);}
function R(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h);}
function P(x,y,c){R(x,y,1,1,c);}
function L(x0,y0,x1,y1,w,c){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
  var dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,e=dx+dy,o=Math.floor(w/2);g.fillStyle=c;
  for(;;){g.fillRect(x0-o,y0-o,w,w);if(x0===x1&&y0===y1)break;var e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}}
function D(cx,cy,r,c){cx=Math.round(cx);cy=Math.round(cy);g.fillStyle=c;for(var y=-r;y<=r;y++)for(var x=-r;x<=r;x++)if(x*x+y*y<=r*r+r*.6)g.fillRect(cx+x,cy+y,1,1);}
function O(cx,cy,r,c,dith){g.fillStyle=c;var n=Math.ceil(r)+1;for(var y=-n;y<=n;y++)for(var x=-n;x<=n;x++){var q=Math.sqrt(x*x+y*y);
  if(Math.abs(q-r)<.6&&(!dith||((x+y)&1)===0))g.fillRect(Math.round(cx)+x,Math.round(cy)+y,1,1);}}
function cl(x){return x<0?0:x>1?1:x}
function sm(a,b,x){x=cl((x-a)/(b-a));return x*x*(3-2*x);}
function rnd(i){var s=Math.sin(i*12.9898+78.233)*43758.5453;return s-Math.floor(s);}
function lerp(a,b,u){return a+(b-a)*u;}
function Q(p,u){var v=1-u;return [v*v*p[0]+2*u*v*p[2]+u*u*p[4],v*v*p[1]+2*u*v*p[3]+u*u*p[5]];}
function star(x,y,c,big){P(x,y,c);P(x-1,y,c);P(x+1,y,c);P(x,y-1,c);P(x,y+1,c);if(big){P(x-2,y,c);P(x+2,y,c);P(x,y-2,c);P(x,y+2,c);P(x,y,BONE);}}

/* ---------- layout ---------- */
var TOPY=12,PAPX=8,PAPW=32,PAPH=50;           /* scroll */
var BOXX=50,BOXW=42,BOXY=63,TABLEY=70;         /* button box on table */
var CAPX=66,CAPW=17,CAPUP=57,CAPDN=60;          /* button cap */
var SX=102,SY=44,L1=26,L2=26;                  /* arm shoulder */
var HOME=[80,40],BTN=[74,57];
var ARC1=[42,9,72,-6,98,31], ARC2=[84,80,52,97,22,74];

/* reward code, as coloured bars: [indent,len,colour,kind] kind: 0 keep, 1 removed, 2 added */
var V1=[[0,13,PURP,0],[3,19,ACCD,0],[3,11,BLUE,1],[3,18,MUTED,0],[3,9,ACCD,1],[3,15,BLUE,0],[6,12,MUTED,1],[0,16,PURP,0]];
var ADD=[[3,14,BLUE],[3,8,ACCD],[6,13,BLUE],[3,17,ACCD],[3,12,BLUE]];
/* where each added line goes (after which V1 row) */
var ADDAT=[2,4,6,6,6];

/* ---------- timeline ---------- */
/* 0.0-0.5 unroll | 0.4-0.9 reward -> robot | 0.8-2.5 attempt 1 (miss) | 2.4-3.1 feedback -> scroll
   3.1-4.7 rewrite | 4.6-5.1 reward -> robot | 5.0-7.3 attempt 2 (press + hold) | 7.4-8.0 roll up */
function open(t){return t<4?sm(0,.5,t):1-sm(7.45,7.95,t);}
function tipAt(t){
  var p=HOME.slice(),bob=Math.sin(t*2*Math.PI*1.5)*.6;
  if(t<.8||t>=7.45)return [p[0],p[1]+bob];
  if(t<2.6){                                       /* attempt 1: reach left, jab beside the button, scrape, retreat */
    if(t<1.3){var u=sm(.8,1.3,t);return [lerp(HOME[0],55,u),lerp(HOME[1],50,u)];}
    if(t<1.5){var u=sm(1.3,1.5,t);return [lerp(55,57,u),lerp(50,62,u)];}
    if(t<2.0){var j=Math.sin((t-1.5)*40)*2.2*(1-sm(1.85,2,t));return [57+j,62-Math.abs(j)*.4];}
    var u=sm(2.0,2.55,t),w=Math.sin(u*Math.PI*3)*(1-u)*3;return [lerp(57,HOME[0],u)+w,lerp(62,HOME[1],u)];
  }
  if(t<5.0)return [p[0],p[1]+bob];
  if(t<5.6){var u=sm(5.0,5.6,t);return [lerp(HOME[0],BTN[0],u),lerp(HOME[1],48,u)];}
  if(t<5.82){var u=cl((t-5.6)/.22);u=u*u;return [BTN[0],lerp(48,BTN[1]+2,u)];}
  if(t<6.95){return [BTN[0],BTN[1]+2+(Math.sin(t*30)>.6?0:0)];}
  var u=sm(6.95,7.45,t);return [lerp(BTN[0],HOME[0],u),lerp(BTN[1]+2,HOME[1],u)-Math.sin(u*Math.PI)*6];
}
function pressed(t){return t>=5.78&&t<7.0;}
function ik(tx,ty){var dx=tx-SX,dy=ty-SY,d=Math.min(Math.sqrt(dx*dx+dy*dy),L1+L2-.05),a=Math.atan2(dy,dx),
  b=Math.acos((L1*L1+d*d-L2*L2)/(2*L1*d)),e1=[SX+L1*Math.cos(a-b),SY+L1*Math.sin(a-b)],e2=[SX+L1*Math.cos(a+b),SY+L1*Math.sin(a+b)];
  var e=e1[1]<e2[1]?e1:e2,ex=tx-e[0],ey=ty-e[1],q=Math.sqrt(ex*ex+ey*ey)||1;return [e,[e[0]+ex/q*L2,e[1]+ey/q*L2]];}

/* ---------- pieces ---------- */
function background(t){
  R(0,0,W,H,NIGHT);
  for(var i=0;i<14;i++){var x=Math.floor(rnd(i)*W),y=Math.floor(rnd(i+40)*58),tw=Math.sin(t*2*Math.PI/LOOP*(1+(i%3))+i*2);
    if(tw>.2)P(x,y,tw>.85?MUTED:MID);}
  /* table */
  R(46,TABLEY,74,1,PHI2);R(46,TABLEY+1,74,6,PHI);R(46,TABLEY+7,74,1,PANEL);
  for(var x=48;x<120;x+=4)P(x,TABLEY+3,PANEL);
  R(52,TABLEY+8,3,12,PANEL);R(112,TABLEY+8,3,12,PANEL);
}
function arcs(t){
  var A=[ARC1,ARC2];
  for(var k=0;k<2;k++){var p=A[k],seen={};
    for(var i=0;i<=160;i++){var u=i/160,q=Q(p,u),x=Math.round(q[0]),y=Math.round(q[1]),key=x+","+y;if(seen[key])continue;seen[key]=1;
      if(Math.floor(i/6-t*3)%2===0)P(x,y,"#6A6082");}}
  /* arrowheads */
  var a=Q(ARC1,1);R(a[0]-2,a[1]-1,5,1,MUTED);R(a[0]-1,a[1],3,1,MUTED);P(a[0],a[1]+1,MUTED);
  var b=Q(ARC2,1);P(b[0],b[1]-1,MUTED);R(b[0]-1,b[1],3,1,MUTED);R(b[0]-2,b[1]+1,5,1,MUTED);
}
function flow(p,t,a,b,c,c2,n){ /* packets travelling along an arc between times a and b */
  if(t<a-.05||t>b+.4)return;
  for(var i=0;i<n;i++){var u=(t-a)/(b-a)-i*.12;if(u<0||u>1)continue;var q=Q(p,u);
    D(q[0],q[1],i===0?2:1,c);P(q[0],q[1],c2);
    var q2=Q(p,Math.max(0,u-.04));P(q2[0],q2[1],c);}
}
function scroll(t){
  var o=open(t),ph=Math.round(PAPH*o),bot=TOPY+4+ph;
  var rw=t>=3.1&&t<4.75,glow=rw?Math.sin(cl((t-3.1)/1.65)*Math.PI):0,fade=1-sm(6.3,7.2,t);
  /* glow halo while the reward is being rewritten */
  if(glow>0){g.globalAlpha=glow*.9;
    for(var r=1;r<=4;r++){var c=r<3?ACC:ACCD;g.globalAlpha=glow*(1-(r-1)/4);
      for(var x=PAPX-r;x<PAPX+PAPW+r;x++){if(((x+r+Math.floor(t*12))&1)===0){P(x,TOPY+4-r,c);P(x,bot+r-1,c);}}
      for(var y=TOPY+4-r;y<bot+r;y++){if(((y+r+Math.floor(t*12))&1)===0){P(PAPX-r,y,c);P(PAPX+PAPW+r-1,y,c);}}}
    g.globalAlpha=1;}
  /* paper */
  if(ph>0){R(PAPX,TOPY+4,PAPW,ph,BONE);R(PAPX,TOPY+4,1,ph,TEXT);R(PAPX+PAPW-1,TOPY+4,1,ph,TEXT);
    R(PAPX+1,TOPY+4,PAPW-2,1,TEXT);}
  /* code rows */
  var rows=[],stage2=t>=3.1;
  for(var i=0;i<V1.length;i++){var v=V1[i];
    if(v[3]===1&&stage2){var kill=sm(3.45+i*.04,3.75+i*.04,t);rows.push({v:v,kind:1,len:v[1]*(1-kill),h:4*(1-sm(3.7,3.95,t)),fl:t<3.75});}
    else rows.push({v:v,kind:0,len:v[1],h:4});
    for(var k=0;k<ADD.length;k++)if(ADDAT[k]===i&&stage2){var st=3.85+k*.16,u=cl((t-st)/.2);
      if(t>=3.75)rows.push({v:ADD[k],kind:2,len:Math.round(ADD[k][1]*u),h:4*sm(3.75,3.95+k*.1,t),caret:t>=st&&t<st+.3});}}
  var y=TOPY+8,cx0=PAPX+4,caret=null;
  for(var i=0;i<rows.length;i++){var r=rows[i];if(r.h<.5){continue;}var yy=Math.round(y);
    if(yy+2<bot-1){
      if(r.kind===1){if(r.fl&&Math.floor(t*10)%2===0||!r.fl)R(PAPX+2,yy-1,PAPW-4,Math.min(4,Math.round(r.h)),REDL);
        if(r.len>=1)R(cx0+r.v[0],yy,Math.round(r.len),2,RED);}
      else if(r.kind===2){if(fade>0){g.globalAlpha=fade;R(PAPX+2,yy-1,PAPW-4,Math.min(4,Math.round(r.h)),GRNL);g.globalAlpha=1;}
        if(r.len>=1)R(cx0+r.v[0],yy,r.len,2,fade>.5?GRND:r.v[2]);
        if(r.caret)caret=[cx0+r.v[0]+r.len,yy];}
      else R(cx0+r.v[0],yy,r.len,2,r.v[2]);}
    y+=r.h;}
  if(caret&&Math.floor(t*14)%2===0)R(caret[0]+1,caret[1]-1,1,4,OUT);
  /* rollers */
  function roller(yy){R(PAPX-3,yy,PAPW+6,4,ACCD);R(PAPX-2,yy,PAPW+4,1,ACCS);R(PAPX-3,yy+3,PAPW+6,1,"#8A5329");
    R(PAPX-5,yy,2,4,MUTED);R(PAPX+PAPW+3,yy,2,4,MUTED);P(PAPX-5,yy,TEXT);P(PAPX+PAPW+3,yy,TEXT);}
  roller(TOPY);roller(bot);
  /* sparkles thrown off while rewriting */
  if(rw)for(var i=0;i<9;i++){var b=3.15+i*.17,a=t-b;if(a<0||a>.55)continue;var ang=rnd(i+7)*Math.PI*2,sp=10+rnd(i+3)*10;
    var px=PAPX+PAPW/2+Math.cos(ang)*(14+a*sp),py=TOPY+30+Math.sin(ang)*(22+a*sp)*.9;
    star(Math.round(px),Math.round(py),a<.3?ACCS:ACC,a<.15);}
}
function box(t){
  var pr=pressed(t),ct=pr?CAPDN:CAPUP,miss=t>=1.45&&t<2.05;
  /* glow under the button when pressed */
  if(pr){var gl=.3+.12*Math.sin(t*20);
    for(var y=BOXY-5;y<BOXY;y++){g.globalAlpha=gl*(1-(BOXY-1-y)/5);R(CAPX-3,y,CAPW+6,1,GRN);}g.globalAlpha=1;}
  R(BOXX,BOXY,BOXW,TABLEY-BOXY,MID);R(BOXX,BOXY,BOXW,1,MUTED);R(BOXX,BOXY+1,1,TABLEY-BOXY-1,PHI2);
  R(BOXX+BOXW-1,BOXY+1,1,TABLEY-BOXY-1,PANEL);
  R(CAPX-1,BOXY-1,CAPW+2,1,OUT);
  var c1=pr?GRN:RED,c2=pr?"#B8F2C9":"#F08A72",c3=pr?GRND:REDD;
  R(CAPX,ct,CAPW,BOXY-1-ct,c1);R(CAPX+1,ct,CAPW-2,1,c2);R(CAPX,BOXY-2,CAPW,1,c3);
  /* scrape dust on the miss */
  if(miss){for(var i=0;i<6;i++){var a=(t-1.45)*3+rnd(i)*1.2,f=a%1;var px=57+(rnd(i+9)-.5)*10*f,py=BOXY-1-f*6+f*f*5;
    P(px,py,f<.5?TEXT:MUTED);}}
}
function shadow(tip){if(tip[1]>BOXY-14&&tip[0]>BOXX&&tip[0]<BOXX+BOXW){var w=Math.round(lerp(3,7,cl((tip[1]-(BOXY-14))/12)));
  for(var x=-w;x<=w;x++)if(((x+Math.round(tip[0]))&1)===0)P(tip[0]+x,BOXY,PANEL);}}
function arm(t){
  var tip=tipAt(t);tip=[Math.round(tip[0]),Math.round(tip[1])];
  var wr=[tip[0],tip[1]-7],k=ik(wr[0],wr[1]),el=k[0],wa=k[1];
  shadow(tip);
  /* pedestal */
  R(SX-8,TABLEY-4,17,4,MID);R(SX-8,TABLEY-4,17,1,MUTED);R(SX-4,SY+2,9,TABLEY-SY-6,TEXT);R(SX-4,SY+2,2,TABLEY-SY-6,BONE);
  R(SX+3,SY+2,2,TABLEY-SY-6,MUTED);
  /* links: outline, fill, highlight */
  L(SX,SY,el[0],el[1],5,OUT);L(el[0],el[1],wa[0],wa[1],5,OUT);
  L(SX,SY,el[0],el[1],3,BONE);L(el[0],el[1],wa[0],wa[1],3,BONE);
  L(SX,SY+1,el[0],el[1]+1,1,TEXT);L(el[0],el[1]+1,wa[0],wa[1]+1,1,TEXT);
  /* joints */
  D(SX,SY,4,OUT);D(SX,SY,3,ACC);D(SX,SY,1,ACCS);
  D(el[0],el[1],3,OUT);D(el[0],el[1],2,ACC);P(el[0],el[1],ACCS);
  /* wrist + gripper */
  var wx=Math.round(wa[0]),wy=Math.round(wa[1]);
  R(wx-3,wy-1,7,5,OUT);R(wx-2,wy,5,3,MUTED);R(wx-2,wy,5,1,TEXT);
  R(wx-3,wy+4,7,1,OUT);R(wx-3,wy+4,2,tip[1]-wy-3,OUT);R(wx+2,wy+4,2,tip[1]-wy-3,OUT);
  R(wx-2,wy+4,1,tip[1]-wy-4,BONE);R(wx+2,wy+4,1,tip[1]-wy-4,BONE);R(wx-2,wy+4,5,1,BONE);
  return tip;
}
function rings(t){ if(t<5.8||t>6.9)return;
  var a0=t-5.8;if(a0>=0&&a0<.4)O(CAPX+CAPW/2,BOXY-2,5+a0*30,a0<.22?GRN:GRND,false);
  for(var i=0;i<10;i++){var a=t-5.8-rnd(i)*.15;if(a<0||a>.7)continue;var ang=-Math.PI*(.1+.8*rnd(i+20)),sp=28+rnd(i+30)*22;
    var px=CAPX+CAPW/2+Math.cos(ang)*sp*a,py=BOXY-3+Math.sin(ang)*sp*a+30*a*a;P(px,py,a<.35?"#B8F2C9":GRN);if(a<.25)P(px+1,py,GRN);}
}
function badge(t,a,b,ok){ if(t<a||t>b)return;
  var u=t-a,s=u<.12?u/.12*1.25:u<.22?1.25-(u-.12)/.1*.25:1;if(t>b-.15)s=(b-t)/.15;var n=Math.round(6*s);if(n<1)return;
  var cx=50,cy=44;R(cx-n-1,cy-n,2*n+3,2*n+1,OUT);R(cx-n,cy-n-1,2*n+1,2*n+3,OUT);
  R(cx-n,cy-n,2*n+1,2*n+1,ok?GRN:RED);R(cx-n,cy-n,2*n+1,1,ok?"#B8F2C9":"#F08A72");
  if(n<6)return;var c=BONE;
  if(ok){L(cx-4,cy,cx-1,cy+3,2,c);L(cx-1,cy+3,cx+4,cy-2,2,c);}
  else{L(cx-3,cy-3,cx+3,cy+3,2,c);L(cx+3,cy-3,cx-3,cy+3,2,c);}
}

function draw(t){
  var shake=(t>=5.82&&t<5.98)?(Math.floor(t*60)%2?1:-1):0;
  g.setTransform(1,0,0,1,0,0);R(0,0,W,H,NIGHT);g.setTransform(1,0,0,1,0,shake);
  background(t);arcs(t);
  flow(ARC1,t,.45,.95,ACC,ACCS,3);
  flow(ARC2,t,2.45,3.05,RED,REDL,3);
  flow(ARC1,t,4.6,5.05,ACCS,BONE,5);
  flow(ARC2,t,6.95,7.45,GRN,"#B8F2C9",3);
  scroll(t);rings(t);box(t);arm(t);
  badge(t,2.15,3.15,false);badge(t,6.0,7.15,true);
  g.setTransform(1,0,0,1,0,0);
}
function blit(){ctx.imageSmoothingEnabled=false;ctx.fillStyle=NIGHT;ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(art,ox,oy,W*S,H*S);}
var mq=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)"),last=-1e9,t0=null;
var HT=/t=([\d.]+)/.exec(location.hash);function still(){draw(HT?(+HT[1])%LOOP:6.55);blit();}
if(HT)mq={matches:true};
function frame(now){if(mq&&mq.matches){still();return;}
  if(t0===null)t0=now;if(now-last>=16){last=now;draw(((now-t0)/1000)%LOOP);blit();}requestAnimationFrame(frame);}
fit();addEventListener("resize",function(){fit();if(mq&&mq.matches)still();else{draw(0);blit();}});
addEventListener("hashchange",function(){HT=/t=([\d.]+)/.exec(location.hash);if(HT){mq={matches:true};still();}});
if(mq&&mq.addEventListener)mq.addEventListener("change",function(){if(!mq.matches)requestAnimationFrame(frame);else still();});
if(mq&&mq.matches)still();else requestAnimationFrame(frame);
})();
</script></body></html>
