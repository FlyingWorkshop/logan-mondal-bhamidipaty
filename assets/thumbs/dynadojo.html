<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DynaDojo 3D attractor</title>
<style>
html,body{margin:0;height:100%;background:#16121F;overflow:hidden}
canvas{display:block;width:100vw;height:100vh;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges}
</style></head><body>
<canvas id="c" width="120" height="90" aria-label="Pixel art: a rotating 3D Lorenz attractor. A true trajectory and a learned model's trajectory start together, track each other, then diverge."></canvas>
<script>
(()=>{
const W=120,H=90,cv=document.getElementById('c'),g=cv.getContext('2d'),img=g.createImageData(W,H),buf=new Uint32Array(img.data.buffer),zb=new Float32Array(W*H);
const hex=s=>{const n=parseInt(s.slice(1),16);return 0xff000000|(n&255)<<16|(n>>8&255)<<8|n>>16};
const R=a=>a.map(hex);
const NIGHT=hex('#16121F');
const TRUE=R(['#EEE7DA','#C9C2B8','#A8A0AC','#8E879A','#6B6478','#4A4358','#2E2840']);
const MOD=R(['#F8D3A0','#F2A25C','#D9894A','#B86A3A','#8A4F33','#5C392C','#33242A']);
const CLOUD=R(['#54486E','#44395A','#362D4A','#2B243B','#221C2F']);
const GRID=R(['#40375A','#352D4A','#2B243B','#231D30','#1C1727']),SHD=R(['#2A2339','#231D31','#1D1829']);
const GX=hex('#E58F7A'),GY=hex('#9CC59A'),GZ=hex('#8FB3E0'),MUT=hex('#8E879A'),TXT=hex('#C9C2B8');
// Lorenz: true system vs a "learned" model with slightly wrong rho (illustrative, not a paper result)
function f(s,p){return[p[0]*(s[1]-s[0]),s[0]*(p[1]-s[2])-s[1],s[0]*s[1]-p[2]*s[2]]}
function rk(s,p,h){const a=f(s,p),b=f(s.map((v,i)=>v+h/2*a[i]),p),c=f(s.map((v,i)=>v+h/2*b[i]),p),d=f(s.map((v,i)=>v+h*c[i]),p);return s.map((v,i)=>v+h/6*(a[i]+2*b[i]+2*c[i]+d[i]))}
const P=[10,28,8/3],Q=[10,28.2,8/3],h=.005,S=25,n=v=>[v[0]/S,v[1]/S,(v[2]-25)/S];
let s=[1,1,1];for(let i=0;i<4000;i++)s=rk(s,P,h);
const CL=[];let b=s.slice();for(let i=0;i<900;i++){for(let k=0;k<3;k++)b=rk(b,P,h);CL.push(n(b))}
for(let i=0;i<2000;i++)s=rk(s,P,h);
const N=520,T=[],M=[];let a=s.slice(),m=s.slice();
for(let i=0;i<N;i++){T.push(n(a));M.push(n(m));for(let k=0;k<2;k++){a=rk(a,P,h);m=rk(m,Q,h)}}
const FL=-1.08,E=.46,ce=Math.cos(E),se=Math.sin(E),D=3.7,F=124,CX=60,CY=39;
let cp=1,sp=0;
function proj(p){const x1=p[0]*cp-p[1]*sp,y1=p[0]*sp+p[1]*cp,z=p[2],d=y1*ce-z*se+D;return[CX+F*x1/d,CY-F*(y1*se+z*ce)/d,d]}
const dn=d=>Math.min(1,Math.max(0,(d-(D-1.2))/2.3));
function put(x,y,d,c,bias){x|=0;y|=0;if(x<0||y<0||x>=W||y>=H)return;const k=y*W+x;if(d-bias<zb[k]){zb[k]=d-bias;buf[k]=c}}
function seg(A,B,col,bias){let x0=Math.round(A[0]),y0=Math.round(A[1]);const x1=Math.round(B[0]),y1=Math.round(B[1]),dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,L=Math.max(dx,-dy)||1;let e=dx+dy,i=0;
  for(;;){const t=i++/L,d=A[2]+(B[2]-A[2])*t;put(x0,y0,d,col(d),bias);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}}
// 3x5 font
const FT={L:'100100100100111',O:'111101101101111',R:'110101110101101',E:'111100110100111',N:'110101101101101',Z:'111001010100111',T:'111010010010010',U:'101101101101111',M:'101111111101101',D:'110101101101110',X:'101101010101101',Y:'101101010010010'};
function txt(str,x,y,c){for(const ch of str){const p=FT[ch];if(p)for(let i=0;i<15;i++)if(p[i]==='1')buf[(y+(i/3|0))*W+x+i%3]=c;x+=4}}
function rect(x,y,w,hh,c){for(let j=0;j<hh;j++)for(let i=0;i<w;i++)buf[(y+j)*W+x+i]=c}
const LOOP=10;
function draw(ts){
  ts=((ts%LOOP)+LOOP)%LOOP;
  const yaw=.6+ts/LOOP*Math.PI*2;cp=Math.cos(yaw);sp=Math.sin(yaw);
  buf.fill(NIGHT);zb.fill(1e9);
  // floor grid in perspective, fogged by depth
  for(let k=-4;k<=4;k++){const u=k*.4;for(const dir of[0,1]){let prev=null;for(let j=0;j<=32;j++){const v=-1.6+j*.1,p=proj(dir?[u,v,FL]:[v,u,FL]);
    if(prev){seg(prev,p,d=>{const q=dn(d);return q>.96?NIGHT:GRID[Math.min(4,q*5|0)]},-9)}prev=p}}}
  // attractor projected onto the floor
  for(const c of CL){const p=proj([c[0],c[1],FL]);const q=dn(p[2]);if(q<.95){const x=p[0]|0,y=p[1]|0;if(x>=0&&y>=0&&x<W&&y<H)buf[y*W+x]=SHD[Math.min(2,q*3|0)]}}
  zb.fill(1e9);
  // attractor cloud: dim depth-shaded strands
  let pv=proj(CL[0]);for(let i=1;i<CL.length;i++){const p=proj(CL[i]);seg(pv,p,d=>CLOUD[Math.min(4,dn(d)*5|0)],0);pv=p}
  // trajectories
  const run=Math.min(1,Math.max(0,(ts-.4)/8.4)),hi=Math.floor(run*(N-1)),K=120;
  const fade=ts>8.9?Math.min(7,Math.floor((ts-8.9)/.15)):0;
  if(fade<7){
    for(const[TR,RA,bias,dash]of[[T,TRUE,.3,0],[M,MOD,.9,1]]){
      let q=proj(TR[Math.max(0,hi-K)]);
      for(let j=Math.max(1,hi-K+1);j<=hi;j++){const p=proj(TR[j]),age=(hi-j)/K;
        if(!dash||(j>>1)&1)seg(q,p,d=>RA[Math.min(6,Math.round(dn(d)*2+age*2.6)+fade)],bias);q=p}
    }
    // heads: drop line to floor + floor mark, then the point itself
    for(const[TR,RA]of[[M,MOD],[T,TRUE]]){const c=TR[hi],p=proj(c),f0=proj([c[0],c[1],FL]),lv=Math.min(6,Math.round(dn(p[2])*2)+fade);
      const y0=Math.round(p[1]),y1=Math.round(f0[1]),x0=Math.round(p[0]),x1=Math.round(f0[0]);
      for(let y=y0+3;y<y1;y+=2){const t=(y-y0)/(y1-y0||1);put(x0+(x1-x0)*t,y,p[2]+.01,RA[Math.min(6,5+(fade>0))],.05)}
      if(fade<4){put(x1-1,y1,f0[2],RA[5],0);put(x1,y1,f0[2],RA[4],0);put(x1+1,y1,f0[2],RA[5],0)}
      const big=dn(p[2])<.55;
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!big&&(dx&&dy))continue;put(p[0]+dx,p[1]+dy,p[2],RA[Math.min(6,(dx||dy?1:0)+lv)],.6)}
    }
  }
  // axis gizmo (rotation only)
  const OX=12,OY=76,ax=[[1,0,0,GX,'X'],[0,1,0,GY,'Y'],[0,0,1,GZ,'Z']].map(v=>{const x1=v[0]*cp-v[1]*sp,y1=v[0]*sp+v[1]*cp,z=v[2];return{sx:x1*7,sy:-(y1*se+z*ce)*7,d:y1*ce-z*se,c:v[3],l:v[4]}}).sort((A,B)=>B.d-A.d);
  for(const v of ax){const L=Math.max(Math.abs(v.sx),Math.abs(v.sy))|0;for(let i=0;i<=L;i++){const t=i/(L||1);buf[Math.round(OY+v.sy*t)*W+Math.round(OX+v.sx*t)]=v.c}
    if(v.d<.35&&Math.hypot(v.sx,v.sy)>3.5){const lx=Math.round(OX+v.sx*1.45)-1,ly=Math.round(OY+v.sy*1.45)-2;if(lx>=0&&ly>=0&&lx<W-3&&ly<H-5)txt(v.l,lx,ly,v.c)}}
  buf[OY*W+OX]=TXT;
  // labels
  txt('LORENZ',4,4,MUT);
  rect(91,79,5,1,TRUE[0]);txt('TRUE',98,77,TRUE[1]);
  rect(91,85,2,1,MOD[1]);rect(94,85,2,1,MOD[1]);txt('MODEL',98,83,MOD[1]);
  g.putImageData(img,0,0);
}
const ft=/t=([\d.]+)/.exec(location.hash);
if(ft||matchMedia('(prefers-reduced-motion: reduce)').matches){draw(ft?+ft[1]:8.4);return}
let last=-99;const OFF=3,t0=performance.now()-OFF*1000;
function tick(now){if(now-last>=15.5){last=now;draw((now-t0)/1000)}requestAnimationFrame(tick)}
draw(OFF);requestAnimationFrame(tick);
})();
</script></body></html>
