<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Read the Map</title>
<style>html,body{margin:0;height:100%;background:#16121F;overflow:hidden}canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}</style>
</head><body><canvas id="c" role="img" aria-label="Tiger Door gridworld: a robot does not know which hallway holds the goal and which holds the tiger trap. It detours to the map cell, holds up the map, which shows where the goal is, and drives to the goal. Next episode the two swap."></canvas>
<script>
/* Tiger Door (Littman et al. 1995) as used in Xie, Bhamidipaty et al., ICML 2024 (Fig. 2, App. B.1):
   5x4 grid, agent starts top-left, map cell bottom-left, goal and trap at the ends of the top and
   bottom hallways. Their positions are unknown until the agent visits the map cell. Goal = +1.
   Two configurations; this loop plays both (goal bottom, then goal top). */
const W=120,H=90;
const C={night:'#16121F',panel:'#1E1829',floor2:'#251E33',bone:'#EEE7DA',text:'#C9C2B8',muted:'#8E879A',acc:'#F2A25C',soft:'#F8D3A0',
  wall:'#3A3150',wallHi:'#4B4268',mortar:'#29223A',goal:'#86C48A',goalD:'#24402E',trap:'#E0705F',trapD:'#4A1F2A',tan:'#D9A86C',dim:'#6E4A36'};
const off=document.createElement('canvas');off.width=W;off.height=H;const g=off.getContext('2d');g.imageSmoothingEnabled=false;
const cc=document.createElement('canvas');cc.width=18;cc.height=18;const q=cc.getContext('2d');
const pc=document.createElement('canvas');pc.width=21;pc.height=18;const pq=pc.getContext('2d');
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const B4=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5],dz=(x,y,a)=>(B4[(y&3)*4+(x&3)]+.5)/16<a;
let X=g;const R=(x,y,w,h,c)=>{X.fillStyle=c;X.fillRect(x,y,w,h)},P=(x,y,c)=>{X.fillStyle=c;X.fillRect(x,y,1,1)};
function spr(rows,x,y,map,a=1){x=Math.round(x);y=Math.round(y);for(let j=0;j<rows.length;j++)for(let i=0;i<rows[j].length;i++){const c=map[rows[j][i]];if(c&&(a>=1||dz(x+i,y+j,a)))P(x+i,y+j,c)}}
const F5={R:'11110100011000111110101001001010001',E:'11111100001000011110100001000011111',A:'01110100011000111111100011000110001',D:'11110100011000110001100011000111110',
  T:'11111001000010000100001000010000100',H:'10001100011000111111100011000110001',M:'10001110111010110101100011000110001',P:'11110100011000111110100001000010000',
  '?':'01110100010000100010001000000000100','+':'00000001000010011111001000010000000','1':'00100011000010000100001000010001110'};
const F3={'?':'111001011000010','+':'000010111010000','1':'010110010010111'};
function txt(s,x,y,col,f=F5,w=5){for(const ch of s){const m=f[ch];if(m)for(let k=0;k<m.length;k++)if(m[k]=='1')P(x+k%w,y+(k/w|0),col);x+=w+1}}
const ROBOT=['.......a......','.......k......','....bbbbbbs...','...bbbbbbbbs..','...bnnnnnnns..','...bnennnens..','...bbbbbbbbs..','.kkbbbbbbbbskk','.k.bbaaaaabs.k','...bbbbbbbbs..','...bbbbbbbbs..','..www....www..','..www....www..'];
const TIGER=['nn.........nn','noonnnnnnnoon','nooosososooon','nooooooooooon','nsooyoooyoosn','nooonooonooon','nsoowwnwwoosn','nooowwwwwooon','.noooowoooon.','..nnnnnnnnn..'];
const FLAG=['pnn.......','pggggg....','pgggggggg.','pggggggg..','pgggg.....','p.........','p.........','p.........','p.........','pp........','ppp.......'];
const BUB=['.bbbbb.','bbbbbbb','bbbbbbb','bbbbbbb','bbbbbbb','bbbbbbb','.bbbbb.','..bb...','..b....'];
// grid: W wall, M map, A/B hallway ends (top, bottom)
const G=['.WWWW','.W..A','...WW','MW..B'],GX=13,GY=13,PT=19,CS=18;
const cx=c=>GX+c*PT,cy=r=>GY+r*PT;
const TO_MAP=[[0,0],[0,1],[0,2],[0,3]];
const route=top=>[[0,3],[0,2],[1,2],[2,2]].concat(top?[[2,1],[3,1],[4,1]]:[[2,3],[3,3],[4,3]]);
const STEP=.3,T0=.35,T1=T0+3*STEP,TR=T1+.2,TD=2.5,T2=TD+6*STEP,TX=4.85,EP=5.4,LOOP=2*EP;
const ease=u=>u<.5?2*u*u:1-2*(1-u)*(1-u),cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),lerp=(a,b,f)=>a+(b-a)*f;
function along(path,k){const i=Math.min(path.length-2,Math.max(0,Math.floor(k))),f=ease(cl(k-i));
  return{x:lerp(path[i][0],path[i+1][0],f),y:lerp(path[i][1],path[i+1][1],f),i,mv:k>0&&k<path.length-1&&f>0&&f<1}}
function wall(x,y){R(x,y,CS,CS,C.wall);R(x,y,CS,1,C.wallHi);
  for(let r=0;r<5;r++){const yy=y+1+r*4,h=Math.min(3,y+CS-yy);if(h<=0)break;if(yy+3<y+CS)R(x,yy+3,CS,1,C.mortar);
    for(let k=(r&1)?4:0;k<CS;k+=8){if(k>0)R(x+k-1,yy,1,h,C.mortar);R(x+k,yy,Math.min(4,CS-k),1,C.wallHi)}}}
function floor(x,y,c=C.panel){R(x,y,CS,CS,c);for(let v=2;v<CS;v+=4)for(let u=1;u<CS;u+=4)P(x+u+((v>>2)&1)*2,y+v,C.floor2)}
function mapSprite(x,y){const pw=[4,5,5],cols=[C.soft,C.tan,C.soft];let u=0;
  for(let p=0;p<3;p++){const o=p==1?1:0;for(let i=0;i<pw[p];i++,u++)R(x+u,y+2+o,1,9,cols[p])}
  for(const[a,b]of[[1,9],[2,8],[3,7],[5,8],[6,7],[7,6],[10,5],[11,4]])P(x+a,y+b,C.night);
  spr(['.aaa.','aaaaa','aanaa','.aaa.','..a..'],x+9,y-2,{a:C.acc,n:C.night})}
// hallway-end card: '?' until the map is read, then goal flag or tiger
function face(top,isGoal,rev,T){X=q;
  if(!rev){floor(0,0);const d=C.muted;for(let k=1;k<17;k+=2){P(k,1,d);P(k,16,d);P(1,k,d);P(16,k,d)}
    txt('?',7,5,((T*2.5|0)%2)?C.text:C.muted);X=g;return}
  R(0,0,CS,CS,isGoal?C.goalD:C.trapD);const b=isGoal?C.goal:C.trap;R(0,0,CS,1,b);R(0,17,CS,1,b);R(0,0,1,CS,b);R(17,0,1,CS,b);
  if(isGoal)spr(FLAG,5,3,{p:C.bone,g:C.goal,n:C.goal});else spr(TIGER,3,4,{n:C.night,o:C.acc,s:C.night,y:C.bone,w:C.bone});X=g}
// the map, held up: a tiny copy of this grid with the goal and trap marked
function popup(top,flash){X=pq;R(0,0,21,18,flash?C.bone:C.acc);R(1,1,19,16,C.soft);
  for(let r=0;r<4;r++)for(let c=0;c<5;c++){const ch=G[r][c],x=3+c*3,y=3+r*3;
    if(ch=='W')R(x,y,3,3,'#B08055');else if(ch=='A'||ch=='B'){const gl=(ch=='A')==top;R(x,y,3,3,gl?'#3F8A52':C.trap)}
    else if(ch=='M')R(x+1,y+1,1,1,C.acc)}
  R(1,1,19,1,'#FFF3DF');X=g}
function ring(x,y,r,c,a){const n=Math.ceil(r*6.3);for(let k=0;k<n;k++){const t=k/n*6.283,px=Math.round(x+Math.cos(t)*r),py=Math.round(y+Math.sin(t)*r);if(py<GY-1)continue;if(a>=1||dz(px,py,a))P(px,py,c)}}
function frame(T){X=g;const t0=((T%LOOP)+LOOP)%LOOP,ep=t0<EP?0:1,t=t0-ep*EP,top=ep==1;
  R(0,0,W,H,C.night);
  const reading=t>=TR&&t<TD,flash=t>=TR&&t<TR+.5&&((t-TR)*12|0)%2==0;
  txt('READ THE ',25,3,C.bone);txt('MAP',79,3,flash?C.bone:C.acc);
  for(let r=0;r<4;r++)for(let c=0;c<5;c++){const x=cx(c),y=cy(r),ch=G[r][c];
    if(ch=='W')wall(x,y);else if(ch=='M'){floor(x,y,t>=TR&&t<TX+.3?'#3A2C2C':C.panel);mapSprite(x+2,y+4)}else if(ch=='.')floor(x,y)}
  // robot path
  const rt=route(top);let pos,mv=false,alpha=1,trail=[],ahead=null;
  if(t<T0){pos={x:0,y:0};alpha=cl(t/.3)}
  else if(t<T1+.01){const a=along(TO_MAP,(t-T0)/STEP);pos=a;mv=a.mv;trail=TO_MAP.slice(0,a.i+1).concat([[a.x,a.y]])}
  else if(t<TD){pos={x:0,y:3};trail=TO_MAP}
  else{const a=along(rt,(t-TD)/STEP);pos=a;mv=a.mv;trail=TO_MAP.concat(rt.slice(1,a.i+1),[[a.x,a.y]]);if(t<T2)ahead=[[a.x,a.y]].concat(rt.slice(a.i+1))}
  if(t>TX)alpha=1-cl((t-TX)/.3);
  const C2=p=>[cx(p[0])+9,cy(p[1])+9];
  function line(pts,col,gap,a,lim=1e9){let n=0;for(let i=0;i+1<pts.length;i++){const[a0,b0]=C2(pts[i]),[a1,b1]=C2(pts[i+1]),L=Math.round(Math.hypot(a1-a0,b1-b0));
    for(let s=0;s<L;s++,n++){if(n>lim)return;const px=Math.round(lerp(a0,a1,s/L)),py=Math.round(lerp(b0,b1,s/L));if((px+py-1)%gap)continue;if(a>=1||dz(px,py,a))R(px,py,2,2,col)}}}
  line(trail,C.dim,4,alpha);
  // hallway ends flip when the pulse from the map reaches them; flip back at the end of the episode
  const mx=cx(0)+10,my=cy(3)-6;
  for(const r of[1,3]){const isGoal=(r==1)==top,x=cx(4),y=cy(r),d=Math.hypot(x+9-mx,y+9-my),tf=TR+.1+d/110*.55,tb=TX+.1+(r==1?0:.1);
    const p=t<tb?cl((t-tf)/.24):1-cl((t-tb)/.24),w=Math.max(1,Math.round(CS*Math.abs(Math.cos(Math.PI*p))));
    face(top,isGoal,p>.5,T);g.drawImage(cc,0,0,CS,CS,x+((CS-w)>>1),y,w,CS);
    if(p>.3&&p<.7)R(x+((CS-w)>>1),y,w,CS,C.bone)}
  // the route the map revealed: dotted, drawn out from the map, eaten as the robot drives
  const show=cl((t-(TR+.55))/.45);
  if(t<TD&&show>0)line(rt,C.soft,3,1,show*130);else if(ahead)line(ahead,C.soft,3,1);
  // robot
  const rx=cx(0)+2+pos.x*PT,ry=cy(0)+3+pos.y*PT-(mv?1:0),lit=t>=TR;
  if(alpha>0)spr(ROBOT,rx,ry,{a:lit?C.acc:C.muted,k:C.muted,b:C.bone,s:C.text,n:C.night,e:lit?C.soft:C.muted,w:C.muted},alpha);
  // '?' bubble until the map is read
  if(t>.15&&t<T1+.1&&alpha>.5){const bx=Math.round(rx)+11,by=Math.round(ry)-8;spr(BUB,bx,by,{b:C.bone});txt('?',bx+2,by+1,C.night,F3,3)}
  // the map rises out of the cell and opens above the robot
  if(t>T1-.02&&t<TD+.05){const o=t<TD-.15?ease(cl((t-T1+.02)/.2)):1-cl((t-TD+.15)/.2),h=Math.max(1,Math.round(18*o));
    popup(top,flash);const px0=cx(0)-1,py0=cy(3)-16;g.drawImage(pc,0,0,21,18,px0,py0+18-h,21,h);
    // pulse rings from the open map
    const pr=t-TR;for(let i=0;i<2;i++){const f=(pr-.1-i*.14)/.6;if(f>0&&f<1)ring(mx,my,12+f*95,i?C.acc:C.soft,1-f*.9)}}
  // arrival: burst and +1 (the paper's goal reward)
  const ar=t-T2;if(ar>0&&ar<.9){const gx=cx(4)+9,gy=cy(top?1:3)+9;
    for(let k=0;k<8;k++){const an=k/8*6.283+.39,r0=8+ar*20;for(let s=0;s<3;s++){const px=Math.round(gx+Math.cos(an)*(r0+s)),py=Math.round(gy+Math.sin(an)*(r0+s));if(dz(px,py,1-ar))R(px,py,1,1,k&1?C.goal:C.soft)}}
    if(ar<.65){const ty=Math.round(cy(top?1:3)-6-ar*6),tx=cx(4)+3;R(tx-2,ty-2,15,11,C.night);txt('+1',tx,ty,C.goal);txt('+1',tx+1,ty,C.goal)}}
}
function blit(){const d=devicePixelRatio||1,w=innerWidth,h=innerHeight,bw=Math.round(w*d),bh=Math.round(h*d);
  if(cv.width!=bw||cv.height!=bh){cv.width=bw;cv.height=bh;cv.style.width=w+'px';cv.style.height=h+'px'}
  ctx.imageSmoothingEnabled=false;ctx.fillStyle=C.night;ctx.fillRect(0,0,bw,bh);
  let s=Math.floor(Math.min(bw/W,bh/H));if(s<1)s=Math.min(bw/W,bh/H);
  ctx.drawImage(off,Math.round((bw-W*s)/2),Math.round((bh-H*s)/2),Math.round(W*s),Math.round(H*s))}
const STILL=TR+1.0,rm=matchMedia('(prefers-reduced-motion: reduce)');
const fixed=()=>{const m=/t=([\d.]+)/.exec(location.hash);return m?+m[1]:null};
let t0=null,last=0;
const clock=now=>{const f=fixed();if(f!=null)return f;if(rm.matches)return STILL;if(t0===null)t0=now;return STILL+(now-t0)/1000};
function draw(now){frame(clock(now));blit()}
function loop(now){requestAnimationFrame(loop);if(now-last<15)return;last=now;draw(now)}
addEventListener('resize',()=>draw(performance.now()));addEventListener('hashchange',()=>draw(performance.now()));
draw(performance.now());requestAnimationFrame(loop);
</script></body></html>
